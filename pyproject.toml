# pyproject.toml — agentlite paket meta-bilgisi.
#
# Bu dosya iki şey yapar:
#   1. pip ve PyPI'a "ben bu paketim, şu bağımlılıklarım var" diye haber verir.
#   2. ruff, mypy, pytest gibi araçlara ayarlarını verir (tek yerden).

# ─── BUILD BACKEND ───────────────────────────────────────────────
# Paketi nasıl inşa edeceğimizi söyler. hatchling = modern, hızlı,
# sadece bu dosyaya bakar (setup.py YOK).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dağıtım adı 'agentlite-py' ama Python paket dizini 'src/agentlite'.
# Hatchling otomatik tahminde başarısız olur, bu yüzden açıkça söylüyoruz.
[tool.hatch.build.targets.wheel]
packages = ["src/agentlite"]

# ─── PAKET KİMLİĞİ ───────────────────────────────────────────────
[project]
# PyPI dağıtım adı 'agentlite-py' (sade 'agentlite' başkasına ait).
# Python import adı hâlâ 'agentlite' — kullanıcı:
#   pip install agentlite-py
#   from agentlite import Agent, tool
name = "agentlite-py"
version = "0.2.0"
description = "A small, focused library for building Claude-powered agents in Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"   # 3.10+ çünkü type union sözdizimi (str | None) gerek
authors = [{ name = "Hakan Sabunis" }]
keywords = ["ai", "agent", "claude", "anthropic", "llm", "tool-use"]

# PyPI'da kategorize edilirken kullanılır — "Development Status" çok önemli,
# kullanıcı "Alpha" ya da "Production" mu görüyor?
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Kullanıcı `pip install agentlite` deyince bunlar da kurulur.
# Mümkün olduğunca AZ tutuyoruz — her bağımlılık bir risk.
dependencies = [
    "anthropic>=0.40.0",
]

# Geliştirme bağımlılıkları (`pip install agentlite[dev]` ile gelir).
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

# GitHub repo linki — PyPI sayfasında "Homepage" olarak çıkar.
[project.urls]
Homepage = "https://github.com/hakansabunis/agentlite"
Issues = "https://github.com/hakansabunis/agentlite/issues"

# ─── ARAÇLARIN AYARLARI ──────────────────────────────────────────
# Ruff: çok hızlı linter + formatter (flake8 + black yerine)
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # error, pyflakes, isort, bugbear, pyupgrade

# Mypy: tip kontrolü
[tool.mypy]
python_version = "3.10"
strict = true

# Pytest: testleri nerede bul
[tool.pytest.ini_options]
testpaths = ["tests"]
