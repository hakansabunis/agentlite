# GitHub Actions — her push/PR'da otomatik test koşar.
# Yeşil rozet README'de gösterilir; kullanıcılar "test geçiyor mu" anında görür.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Birden çok Python sürümünde teste sok — uyumluluk kanıtı.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # 1. Kodu indir
      - uses: actions/checkout@v4

      # 2. Python kur
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Editable install + dev bağımlılıklar
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-cov

      # 4. Testleri koş + kapsamı raporla
      - name: Run tests
        run: |
          python -X utf8 -m pytest --cov=agentlite --cov-report=term-missing

      # 5. (Bonus) Tip kontrolü
      - name: Type check with mypy
        run: |
          python -m mypy src/agentlite
        continue-on-error: true   # şimdilik uyarı, sonra zorunlu yaparız
